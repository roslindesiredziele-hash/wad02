<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDevApp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
    </head>
<body>
    <marquee>
        <h1>Hello, I have a special gift for U! :)</h1>
    </marquee>
    <marquee behavior="alternate">
        <h1>If you are wise and nice you'll get it soon! :)</h1>
    </marquee>
    <app-root>
        <button
        id="giftButton"
        disabled
        onclick="window.location.href='https://www.bershka.com/pl/tr%C3%B3jk%C4%85tny-top-od-bikini-z-cekinami-c0p226931547.html?colorId=700'">
        🔒 Gift locked
    </button>
    <timer-component>
        <div id="countdown">deadline</div>
    </timer-component>
</app-root>
<script>
const deadline = new Date("2026-10-25T00:00:00");

const timer = setInterval(updateCountdown, 1000);

function updateCountdown() {
    const countdown = document.getElementById("countdown");
    const giftButton = document.getElementById("giftButton");

    const now = new Date();
    const diff = deadline.getTime() - now.getTime();

    if (diff <= 0) {
        clearInterval(timer);

        countdown.innerHTML =
            "🎉 Surprise time! 🎁<br>❤️ Your gift is now unlocked ❤️";

        giftButton.disabled = false;
        giftButton.innerHTML = "🎁 Open Your Gift";
        giftButton.style.animation = "pulse 1s infinite";
        
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    countdown.innerHTML =
        `❤️ Time left until the surprise:<br>
         ${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateCountdown();
</script>
</body>
</html>
